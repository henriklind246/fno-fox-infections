[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fno-fox"
version = "0.1.0"
description = "Time-conditioned Fourier neural operator for 1D fox-rabies reaction-diffusion with admissible source-target training"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "torch==2.7.0",
    "PyYAML==6.0.2",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: numerical convergence or end-to-end tests",
    "gpu: requires a CUDA device",
]
